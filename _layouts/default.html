<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Ioannis IGI</title>
  
  <!-- CSS με Cache Buster για να βλέπεις τις αλλαγές αμέσως -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css?v=' | append: site.time | relative_url }}">
  
  <!-- UI Icons (GitHub, Scholar, κλπ) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
</head>
<body>

  <header class="tech-nav">
    <div class="nav-container">
      <a href="/" class="brand-logo">IOANNIS<span>.IGI</span></a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/archive">Archive</a></li>
      </ul>
    </div>
  </header>

  <div class="grid-container">
    <main class="content-area">
      {{ content }}
    </main>

    <aside class="sidebar">
      <div class="widget profile-card">
        <h3>Identity</h3>
        <p><strong>Ioannis IGI</strong></p>
        <p>Systems Architect & Academic Supervisor</p>
        <div class="social-icons">
          <a href="https://github.com/IoannisIn"><i class="fab fa-github"></i></a>
          <a href="#"><i class="fab fa-linkedin"></i></a>
          <a href="#"><i class="ai ai-google-scholar"></i></a>
          <a href="#"><i class="fas fa-envelope"></i></a>
        </div>
      </div>

      <div class="widget search-box">
        <h3>Search Logs</h3>
        <input type="text" id="live-search" placeholder="Search tech specs...">
        <div id="results-container"></div>
      </div>

      <div class="widget archive-box">
        <h3>Archives</h3>
        <ul id="dynamic-archive">
          <!-- Αυτό γεμίζει αυτόματα με JS -->
        </ul>
      </div>
    </aside>
  </div>

  <script src="/assets/js/main.js"></script>
</body>
</html>
