<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  
  <!-- UI Icons Layer -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" media="print" onload="this.media='all'">

  <!-- SEO Graph Matrix -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "headline": "{{ site.title }}",
    "url": "{{ site.url }}"
  }
  </script>
</head>
<body>

  <nav class="navbar">
    <div class="logo"><a href="{{ '/' | relative_url }}">&gt;_ ioannis_igi</a></div>
    <button class="menu-toggle" id="menu-toggle-btn" aria-label="Toggle Menu">
      <i class="fas fa-bars"></i>
    </button>
    <ul class="nav-links" id="navbar-menu">
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/about.html' | relative_url }}">About</a></li>
      <li><a href="{{ '/projects.html' | relative_url }}">Projects</a></li>
      <li><a href="{{ '/archive.html' | relative_url }}">Archive</a></li>
    </ul>
  </nav>

  <div class="main-wrapper">
    <!-- Main Content Stream (Left Side) -->
    <main>
      {{ content }}
    </main>

    <!-- Refined Engineering Sidebar (Right Side) -->
    <aside class="sidebar-layout">
      <!-- Profile Info -->
      <div class="sidebar-widget">
        <h3>Author</h3>
        <div style="font-weight: 700; font-size: 1.1rem;">Ioannis IGI</div>
        <div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem;">Systems Architect & Academic Supervisor</div>
        <div class="social-icons">
          <a href="https://github.com/IoannisIn" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>
          <a href="#" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="#" target="_blank" rel="noopener" aria-label="Google Scholar"><i class="ai ai-google-scholar"></i></a>
          <a href="#" target="_blank" rel="noopener" aria-label="ORCID"><i class="ai ai-orcid"></i></a>
          <a href="mailto:your-email@example.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
        </div>
      </div>

      <!-- Search Widget Execution -->
      <div class="sidebar-widget">
        <h3>Search Publications</h3>
        <input type="text" id="tech-search" class="search-input" placeholder="Search keywords, logs, specs..." aria-label="Search posts">
        <div id="search-output-box" style="margin-top: 1rem; max-height: 250px; overflow-y: auto;"></div>
      </div>

      <!-- Archive Group Index -->
      <div class="sidebar-widget">
        <h3>Chronological Archive</h3>
        <ul class="archive-ul" id="dynamic-archive-list">
          <!-- Populated instantly from posts.json -->
        </ul>
      </div>
    </aside>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
