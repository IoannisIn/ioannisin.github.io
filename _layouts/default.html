<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <!-- Cache Busting Link για άμεση ανανέωση -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css?v=2.0' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  
  <!-- Icons (Async Loading για Lighthouse Performance) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" media="print" onload="this.media='all'">

  <!-- OpenGraph / Metadata Matrix -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
</head>
<body>

  <nav class="navbar">
    <div class="brand"><a href="{{ '/' | relative_url }}">&gt;_ ioannis<span>.igi</span></a></div>
    <button class="menu-btn" id="burger-menu-trigger" aria-label="Toggle Menu">
      <i class="fas fa-bars"></i>
    </button>
    <ul class="nav-links" id="main-nav-drawer">
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/about.html' | relative_url }}">About</a></li>
      <li><a href="{{ '/projects.html' | relative_url }}">Projects</a></li>
      <li><a href="{{ '/archive.html' | relative_url }}">Archive</a></li>
    </ul>
  </nav>

  <div class="main-container">
    <!-- Main Left Column -->
    <main>
      {{ content }}
    </main>

    <!-- Engineering Sidebar Right -->
    <aside class="sidebar-wrapper">
      <!-- Author Identity Widget -->
      <div class="widget-box">
        <h3>Identity</h3>
        <div style="font-weight: 700; font-size: 1.1rem; color: var(--text-primary);">Ioannis IGI</div>
        <div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.8rem;">Systems Architect & Academic Supervisor</div>
        <div class="social-flex">
          <a href="https://github.com/IoannisIn" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>
          <a href="#" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="#" target="_blank" rel="noopener" aria-label="Google Scholar"><i class="ai ai-google-scholar"></i></a>
          <a href="#" target="_blank" rel="noopener" aria-label="ORCID"><i class="ai ai-orcid"></i></a>
          <a href="mailto:your-email@example.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
        </div>
      </div>

      <!-- Live Search Core -->
      <div class="widget-box">
        <h3>Search Logs</h3>
        <input type="text" id="sidebar-search-trigger" class="search-bar-input" placeholder="Search code, specs, hardware..." aria-label="Search posts">
        <div id="search-results-panel" style="margin-top: 1rem; max-height: 280px; overflow-y: auto;"></div>
      </div>

      <!-- Month/Year Archive -->
      <div class="widget-box">
        <h3>Chronological Archive</h3>
        <ul class="archive-ui" id="sidebar-dynamic-archive">
          <!-- Populated dynamically via main.js -->
        </ul>
      </div>
    </aside>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
