---
layout: default
---
<h2 style="margin-bottom: 1.5rem; font-family: monospace;">&gt;_ Recent Publications</h2>

<div class="posts-feed">
  {% for post in site.posts %}
    <article style="margin-bottom: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
      <h3 style="font-size: 1.4rem; margin-bottom: 0.4rem;">
        <a href="{{ post.url | relative_url }}" style="color: var(--text-main); text-decoration: none;">{{ post.title }}</a>
      </h3>
      <small style="color: var(--text-muted); display: block; margin-bottom: 0.8rem;">
        <i class="far fa-calendar-alt"></i> {{ post.date | date: "%B %d, %Y" }}
      </small>
      <p style="color: #334155;">{{ post.excerpt | strip_html | truncatewords: 35 }}</p>
    </article>
  {% endfor %}
</div>
