---
layout: default
---
<h2>Recent Publications & Entries</h2>
<hr style="margin: 1rem 0; border: 0; border-top: 1px solid var(--border);">

<div id="posts-container">
  {% for post in site.posts limit: 5 %}
    <article style="margin-bottom: 2rem;">
      <h3><a href="{{ post.url | relative_url }}" style="color: var(--dark); text-decoration: none;">{{ post.title }}</a></h3>
      <small style="color: #666;">Published: {{ post.date | date: "%B %d, %Y" }}</small>
      <p style="margin-top: 0.5rem;">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
    </article>
  {% endfor %}
</div>
